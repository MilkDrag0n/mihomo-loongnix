name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository guard
        run: ./scripts/check-secrets.sh
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
